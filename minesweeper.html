<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Campo Minado</title>
<style>
:root{
  --bg:#dfe3e8;--panel:#c6ccd4;--raise:#d9dee5;--hi:#fff;--lo:#8b94a0;--open:#eceff3;--ink:#1c232b;--muted:#4f5a66;
  --n1:#1d4ed8;--n2:#15803d;--n3:#dc2626;--n4:#1e3a8a;--n5:#9a3412;--n6:#0e7490;--n7:#111;--n8:#6b7280;--accent:#2563eb;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#12151a;--panel:#1b2027;--raise:#2a313b;--hi:#3b4552;--lo:#0a0c0f;--open:#181c22;--ink:#e6eaf0;--muted:#98a3b1;
    --n1:#6ea8ff;--n2:#5fd38a;--n3:#ff6b6b;--n4:#8fa8ff;--n5:#ff9f6b;--n6:#4fd1e0;--n7:#e5e7eb;--n8:#9ca3af;--accent:#6ea8ff;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12151a;--panel:#1b2027;--raise:#2a313b;--hi:#3b4552;--lo:#0a0c0f;--open:#181c22;--ink:#e6eaf0;--muted:#98a3b1;
  --n1:#6ea8ff;--n2:#5fd38a;--n3:#ff6b6b;--n4:#8fa8ff;--n5:#ff9f6b;--n6:#4fd1e0;--n7:#e5e7eb;--n8:#9ca3af;--accent:#6ea8ff;color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{min-height:100%;scroll-padding-top:env(safe-area-inset-top,0px);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);
  font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  display:flex;flex-direction:column;align-items:center;gap:12px;padding:14px 12px 24px;user-select:none;-webkit-user-select:none}
h1{margin:0;font-size:1.3rem;letter-spacing:.01em}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}
button{font:inherit;color:var(--ink);background:var(--raise);border:2px solid;border-color:var(--hi) var(--lo) var(--lo) var(--hi);
  border-radius:6px;padding:7px 14px;cursor:pointer;touch-action:manipulation}
button:active{border-color:var(--lo) var(--hi) var(--hi) var(--lo)}
button[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#hud{display:flex;align-items:center;justify-content:space-between;gap:16px;background:var(--panel);padding:8px 12px;border-radius:8px;width:min(100%,360px)}
.lcd{font:700 1.6rem/1 ui-monospace,Menlo,Consolas,"Courier New",monospace;background:#1a0b0b;color:#ff4a3a;padding:6px 8px;border-radius:4px;min-width:3.4ch;text-align:center;letter-spacing:.05em}
#face{font-size:1.7rem;line-height:1;padding:4px 10px}
#bw{max-width:100%;overflow:auto;background:var(--panel);padding:8px;border-radius:8px;touch-action:pan-x pan-y}
#board{display:grid;width:max-content;margin:0 auto;gap:0;border:3px solid;border-color:var(--lo) var(--hi) var(--hi) var(--lo);
  grid-template-columns:repeat(var(--cols),var(--cs))}
.cell{width:var(--cs);height:var(--cs);font-size:calc(var(--cs)*.56);font-weight:800;display:flex;align-items:center;justify-content:center;
  background:var(--raise);border:3px solid;border-color:var(--hi) var(--lo) var(--lo) var(--hi);cursor:pointer;line-height:1;overflow:hidden}
.cell.o{background:var(--open);border:1px solid var(--lo);cursor:default}
.cell.boom{background:#dc2626}
.n1{color:var(--n1)}.n2{color:var(--n2)}.n3{color:var(--n3)}.n4{color:var(--n4)}.n5{color:var(--n5)}.n6{color:var(--n6)}.n7{color:var(--n7)}.n8{color:var(--n8)}
#msg{margin:0;min-height:1.4em;text-align:center}
.small{font-size:.85rem;color:var(--muted);text-align:center;margin:0;max-width:46ch}
#mode{display:none}
@media (hover:none),(pointer:coarse){#mode{display:inline-block}.desk{display:none}}
</style>
</head>
<body>
<h1>Campo Minado</h1>
<div class="row" id="lvls" role="group" aria-label="Dificuldade">
  <button type="button" data-l="f">Fácil</button>
  <button type="button" data-l="m">Médio</button>
  <button type="button" data-l="d">Difícil</button>
</div>
<div id="hud">
  <div class="lcd" id="mc" aria-label="Minas restantes">010</div>
  <button type="button" id="face" aria-label="Novo jogo">🙂</button>
  <div class="lcd" id="tc" aria-label="Tempo">000</div>
</div>
<div id="bw"><div id="board" aria-label="Tabuleiro"></div></div>
<button type="button" id="mode" aria-pressed="false">Modo: revelar</button>
<p id="msg" role="status" aria-live="polite"></p>
<p class="small" id="best"></p>
<p class="small desk">Clique esquerdo: revelar · direito: bandeira · botão do meio (ou clique num número): abrir os vizinhos.</p>
<p class="small" id="tip"></p>
<script>
(function(){
"use strict";
var LV={f:{c:9,r:9,m:10},m:{c:16,r:16,m:40},d:{c:30,r:16,m:99}};
var NAMES={f:"Fácil",m:"Médio",d:"Difícil"}, KEY="campo.melhores.v1";
var $=function(id){return document.getElementById(id);};
var board=$("board"),face=$("face"),mc=$("mc"),tc=$("tc"),msg=$("msg"),bestEl=$("best"),modeBtn=$("mode");
var lv="f",C,R,M,grid,over,started,firstDone,opened,flags,t0,tmr,flagMode=false,best={},press=null;

/* Melhores tempos: leitura validada */
try{
  var o=JSON.parse(localStorage.getItem(KEY)||"{}");
  ["f","m","d"].forEach(function(k){var v=o&&o[k];if(Number.isInteger(v)&&v>=1&&v<=999)best[k]=v;});
}catch(e){}
$("tip").textContent="Toque: revelar · segure: bandeira (ou use o botão de modo). Toque num número para abrir os vizinhos.";

function pad(n){var s=String(Math.min(999,Math.abs(n)));while(s.length<3)s="0"+s;return n<0?"-"+s.slice(1):s;}
function secs(){return Math.max(1,Math.floor((Date.now()-t0)/1000));}
function nb(i){
  var x=i%C,y=(i/C)|0,out=[],dx,dy,X,Y;
  for(dy=-1;dy<=1;dy++)for(dx=-1;dx<=1;dx++){
    if(!dx&&!dy)continue;X=x+dx;Y=y+dy;
    if(X>=0&&Y>=0&&X<C&&Y<R)out.push(Y*C+X);
  }
  return out;
}
function layout(){
  var avail=Math.min(window.innerWidth-40,760),cs=Math.max(26,Math.min(44,Math.floor(avail/C)));
  board.style.setProperty("--cs",cs+"px");
}
function showBest(){
  bestEl.textContent=best[lv]?("Melhor tempo em "+NAMES[lv]+": "+best[lv]+" s"):("Sem recorde em "+NAMES[lv]+" ainda.");
}
function counter(){mc.textContent=pad(M-flags);}
function newGame(){
  clearInterval(tmr);
  C=LV[lv].c;R=LV[lv].r;M=LV[lv].m;grid=[];over=false;started=false;firstDone=false;opened=0;flags=0;
  tc.textContent="000";counter();face.textContent="🙂";msg.textContent="Faça o primeiro clique: ele é sempre seguro.";
  board.textContent="";board.style.setProperty("--cols",String(C));
  var frag=document.createDocumentFragment(),i,el;
  for(i=0;i<C*R;i++){
    el=document.createElement("div");el.className="cell";el.setAttribute("data-i",String(i));
    grid.push({m:false,n:0,o:false,f:false,el:el});frag.appendChild(el);
  }
  board.appendChild(frag);layout();showBest();
  Array.prototype.forEach.call(document.querySelectorAll("#lvls button"),function(b){
    b.setAttribute("aria-pressed",String(b.getAttribute("data-l")===lv));
  });
}
function place(safe){
  var ex={},i,j,pool=[],list=nb(safe);
  list.push(safe);
  if(C*R-list.length<M)list=[safe];            /* tabuleiro apertado: protege só a casa clicada */
  list.forEach(function(k){ex[k]=1;});
  for(i=0;i<C*R;i++)if(!ex[i])pool.push(i);
  for(i=pool.length-1;i>0;i--){j=Math.floor(Math.random()*(i+1));var t=pool[i];pool[i]=pool[j];pool[j]=t;}
  pool.slice(0,M).forEach(function(k){grid[k].m=true;});
  for(i=0;i<C*R;i++)grid[i].n=nb(i).filter(function(k){return grid[k].m;}).length;
}
function paint(i){
  var g=grid[i];
  g.el.className="cell"+(g.o?" o":"")+(g.o&&g.n?" n"+g.n:"");
  g.el.textContent=g.o?(g.n?String(g.n):""):(g.f?"🚩":"");
}
function startTimer(){
  started=true;t0=Date.now();tc.textContent="001";
  tmr=setInterval(function(){tc.textContent=pad(secs());},250);
}
function flood(i){
  var st=[i],j,g,n,k;
  while(st.length){
    j=st.pop();g=grid[j];
    if(g.o||g.f||g.m)continue;
    g.o=true;opened++;paint(j);
    if(g.n===0){n=nb(j);for(k=0;k<n.length;k++)if(!grid[n[k]].o&&!grid[n[k]].f)st.push(n[k]);}
  }
}
function reveal(i){
  var g=grid[i];
  if(over||g.o||g.f)return;
  if(!firstDone){firstDone=true;place(i);startTimer();}
  if(g.m){lose(i);return;}
  flood(i);
  if(opened===C*R-M)win();
}
function chord(i){
  var g=grid[i],n=nb(i),k,fl=0;
  if(over||!g.o||!g.n)return;
  n.forEach(function(j){if(grid[j].f)fl++;});
  if(fl!==g.n)return;
  for(k=0;k<n.length&&!over;k++)reveal(n[k]);
}
function toggleFlag(i){
  var g=grid[i];
  if(over||g.o)return;
  g.f=!g.f;flags+=g.f?1:-1;paint(i);counter();
}
function lose(hit){
  over=true;clearInterval(tmr);face.textContent="😵";
  grid.forEach(function(g,i){
    if(g.m&&!g.f){g.el.className="cell o"+(i===hit?" boom":"");g.el.textContent="💣";}
    else if(g.f&&!g.m){g.el.className="cell o";g.el.textContent="❌";}
  });
  msg.textContent="Boom! Você pisou em uma mina.";
}
function win(){
  over=true;clearInterval(tmr);face.textContent="😎";
  grid.forEach(function(g,i){if(g.m&&!g.f){g.f=true;paint(i);}});
  flags=M;counter();
  var t=secs(),rec=!best[lv]||t<best[lv];
  tc.textContent=pad(t);
  if(rec){
    best[lv]=t;
    try{localStorage.setItem(KEY,JSON.stringify(best));}catch(e){}
    showBest();
  }
  msg.textContent="Você venceu em "+t+" s"+(rec?" (novo recorde!)":"")+".";
}

/* Entrada: mouse, toque (toque longo = bandeira) */
function act(i){
  if(grid[i].o)chord(i);
  else if(flagMode)toggleFlag(i);
  else reveal(i);
}
function cellOf(e){var el=e.target&&e.target.closest?e.target.closest(".cell"):null;return el?Number(el.getAttribute("data-i")):-1;}
board.addEventListener("pointerdown",function(e){
  var i=cellOf(e);if(i<0||!grid[i])return;
  if(e.pointerType==="mouse"){
    if(e.button===2){e.preventDefault();toggleFlag(i);}
    else if(e.button===1){e.preventDefault();chord(i);}
    else if(e.button===0)press={i:i,long:false,moved:false,x:e.clientX,y:e.clientY,t:0};
    return;
  }
  press={i:i,long:false,moved:false,x:e.clientX,y:e.clientY,t:0};
  press.t=setTimeout(function(){
    if(!press||press.moved)return;
    press.long=true;
    if(grid[press.i].o)chord(press.i);else toggleFlag(press.i);
    try{if(navigator.vibrate)navigator.vibrate(25);}catch(er){}
  },420);
});
board.addEventListener("pointermove",function(e){
  if(press&&Math.abs(e.clientX-press.x)+Math.abs(e.clientY-press.y)>10){press.moved=true;clearTimeout(press.t);}
});
board.addEventListener("pointerup",function(e){
  if(!press)return;
  clearTimeout(press.t);
  var p=press;press=null;
  if(!p.long&&!p.moved&&e.button===0&&cellOf(e)===p.i)act(p.i);
});
["pointercancel","pointerleave"].forEach(function(n){board.addEventListener(n,function(){if(press){clearTimeout(press.t);press=null;}});});
board.addEventListener("contextmenu",function(e){e.preventDefault();});

face.addEventListener("click",newGame);
modeBtn.addEventListener("click",function(){
  flagMode=!flagMode;modeBtn.setAttribute("aria-pressed",String(flagMode));
  modeBtn.textContent="Modo: "+(flagMode?"bandeira":"revelar");
});
Array.prototype.forEach.call(document.querySelectorAll("#lvls button"),function(b){
  b.addEventListener("click",function(){var l=b.getAttribute("data-l");if(LV[l]){lv=l;newGame();}});
});
window.addEventListener("keydown",function(e){
  if(!e.ctrlKey&&!e.metaKey&&!e.altKey&&(e.key==="r"||e.key==="R"||e.key==="F2")){e.preventDefault();newGame();}
});
window.addEventListener("resize",layout);
newGame();
})();
</script>
</body>
</html>
